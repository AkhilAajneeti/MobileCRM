<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CRM -  Aajneeti Connect ltd.</title>
  <!--
    `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to real
    numbers on iOS. Without it they are all 0, so every pt-safe / pb-safe in
    the app (header, sidebar, drawers, bottom sheets) silently collapses and
    the fixed header sits under the notch / Dynamic Island. Android is
    unaffected: Capacitor does not draw edge-to-edge there by default.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F6" />

  <!--
    Theme, applied BEFORE first paint.

    Without this the page always paints light for the few hundred
    milliseconds it takes the bundle to parse and the provider to mount, so a
    rep who chose dark mode gets a white flash on every launch -- which on a
    phone, opened dozens of times a day, is the most visible thing about the
    feature.

    Kept inline and dependency-free for the same reason: anything imported
    arrives too late to matter. The storage key and class name are duplicated
    from src/ThemeContext.jsx; change them in both.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('crm_theme');
        var dark =
          stored === 'dark' ||
          ((!stored || stored === 'system') &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0E1116');
        }
      } catch (e) {
        /* storage blocked -- fall through to the light theme */
      }
    })();
  </script>
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="icon" href="/assets/images/aajneeti-favicon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!--
    iOS "Add to Home Screen" ignores the web manifest's icons and display mode.
    Safari reads apple-touch-icon (PNG only -- webp is not reliably supported)
    and these apple-mobile-* tags instead; without them the home-screen icon is
    a screenshot of the page and the app opens in a normal Safari tab with the
    address bar showing.
  -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AajneetiCRM" />
